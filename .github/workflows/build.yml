name: Source checks

# Modified for this unofficial port: static checks only.
# No stock firmware download, image packaging, flashing or automatic release.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Syntax checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax without generating cache files
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if any(part in {'.git', 'target', '__pycache__'} for part in path.parts):
                  continue
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          PY
      - name: Check shell syntax
        run: |
          for script in tools/*.sh tools/*/*.sh; do
            [ -e "$script" ] || continue
            sh -n "$script"
          done
